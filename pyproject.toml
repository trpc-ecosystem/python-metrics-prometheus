[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "trpc_metrics_prometheus/version.py"

[project]
name = "trpc-metrics-prometheus"
dynamic = ["version"]
description = "prometheus plugin for trpc framework"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "tRPC Group" }]
keywords = ["trpc", "metrics", "prometheus", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "trpc-python ; sys_platform != 'win32'",
    "prometheus-client>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["trpc_metrics_prometheus"]

[tool.hatch.build.targets.sdist]
include = [
    "trpc_metrics_prometheus",
    "tests",
    "examples",
    "README.md",
    "README_zh_CN.md",
    "CHANGELOG.md",
    "LICENSE",
]

# uv project configuration. Defaults to the public PyPI index; the project is
# installed as an editable package.
[tool.uv]
package = true

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
indent_width = 4
split_before_logical_operator = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
